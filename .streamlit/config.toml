# Wine Innovation Engine: presentation theme.
#
# Colours are set here rather than with injected CSS so they apply consistently to
# every widget and survive Streamlit upgrades. The chart palettes are the validated
# categorical / sequential / diverging sets, so charts inherit them and no page needs
# to name a colour scheme of its own.

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.85rem"
headingFontSizes = ["32px", "24px", "19px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
linkUnderline = false
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#8C2F39"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F5F3"
textColor = "#1C1E21"
linkColor = "#8C2F39"
borderColor = "#E3E0DA"
codeBackgroundColor = "#F6F5F3"
codeTextColor = "#1C1E21"
dataframeBorderColor = "#E3E0DA"
dataframeHeaderBackgroundColor = "#F2F0EC"

greenColor = "#0CA30C"
greenTextColor = "#006300"
redColor = "#D03B3B"
redTextColor = "#A42020"
orangeColor = "#EC835A"
orangeTextColor = "#9A4318"
yellowColor = "#FAB219"
blueColor = "#2A78D6"
violetColor = "#4A3AA7"
grayColor = "#5B6269"

chartCategoricalColors = ["#2A78D6", "#EB6834", "#1BAF7A", "#EDA100", "#E87BA4", "#008300", "#4A3AA7", "#E34948"]
chartSequentialColors = ["#CDE2FB", "#B7D3F6", "#9EC5F4", "#86B6EF", "#6DA7EC", "#5598E7", "#3987E5", "#256ABF", "#184F95", "#0D366B"]
chartDivergingColors = ["#0D366B", "#1C5CAB", "#3987E5", "#86B6EF", "#CDE2FB", "#FAD6D2", "#EA9A93", "#D75852", "#9E3431", "#621B1A"]

[theme.light.sidebar]
backgroundColor = "#F6F5F3"
secondaryBackgroundColor = "#EDEBE6"
codeBackgroundColor = "#EDEBE6"
textColor = "#1C1E21"
borderColor = "#E3E0DA"
primaryColor = "#8C2F39"

[theme.dark]
