backgroundColor = "#1A1A19"
secondaryBackgroundColor = "#242422"
textColor = "#E9E8E4"
linkColor = "#E2899B"
borderColor = "#35352F"
codeBackgroundColor = "#242422"
codeTextColor = "#E9E8E4"
dataframeBorderColor = "#35352F"
dataframeHeaderBackgroundColor = "#2B2B28"

greenColor = "#0CA30C"
redColor = "#E66767"
orangeColor = "#EC835A"
yellowColor = "#FAB219"
blueColor = "#3987E5"
violetColor = "#9085E9"
grayColor = "#A6A5A0"

chartCategoricalColors = ["#3987E5", "#D95926", "#199E70", "#C98500", "#D55181", "#008300", "#9085E9", "#E66767"]
chartSequentialColors = ["#0D366B", "#184F95", "#256ABF", "#3987E5", "#5598E7", "#6DA7EC", "#86B6EF", "#9EC5F4", "#B7D3F6", "#CDE2FB"]
chartDivergingColors = ["#0D366B", "#1C5CAB", "#3987E5", "#86B6EF", "#CDE2FB", "#FAD6D2", "#EA9A93", "#D75852", "#9E3431", "#621B1A"]

[theme.dark.sidebar]
